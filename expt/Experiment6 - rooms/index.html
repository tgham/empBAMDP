<!DOCTYPE html>
<html>
    <head>
        <title>Button room experiment</title>
        <!-- jspsych -->
        <script src="jspsych/jspsych.js"></script>
        <script src="jspsych/plugin-html-keyboard-response.js"></script>
        <script src="jspsych/plugin-html-button-response.js"></script>
        <script src="jspsych/plugin-preload.js"></script>
        <script src="jspsych/plugin-fullscreen.js"></script>
        <script src="jspsych/plugin-instructions.js"></script>
        <script src="jspsych/plugin-survey-multi-choice.js"></script>
        <!-- my code -->
        <script src="js/config.js"></script>
        <script src="js/render.js"></script>
        <script src="js/trials.js"></script>
        <script src="js/instructions.js"></script>
        <script src="js/comprehension.js"></script>
        <script src="js/attention.js"></script>
        <!-- end-of-experiment questionnaires -->
        <script src="jsQ/plugin-survey-template.js"></script>
        <script src="jsQ/plugin-survey-feedback.js"></script>
        <script src="jsQ/ius12.js"></script>
        <script src="jsQ/loc74.js"></script>
        <script src="backend_integration.js" ></script>
        <!-- css -->
        <link href="jspsych/jspsych.css" rel="stylesheet" type="text/css" />
        <link href="css/style.css" rel="stylesheet" />
    </head>
    <body></body>
    <script>
        //------------------------------------//
        // Session identifiers + data saving
        //------------------------------------//
        // Prolific-style params if present in the URL, else a random id.
        var urlParams = new URLSearchParams(window.location.search);
        var subject_id = urlParams.get("PROLIFIC_PID") || ("anon_" + Date.now());
        var study_id = urlParams.get("STUDY_ID") || "";
        var session_id = urlParams.get("SESSION_ID") || "";

        // comprehension gate bookkeeping (read by the loops/conditionals below).
        // Under DEBUGGING the quiz never runs, so the gate starts open -- otherwise
        // the task itself (conditional on quiz_passed) would be skipped too.
        var review_instructions = false;
        var quiz_passed = DEBUGGING;
        var quiz_attempts = 0;

        var jsPsych = initJsPsych({
            // A bare progress bar pinned to the top of the screen: no message, no
            // numbers. It is driven by hand from each room intro (see
            // setRoomProgress), not by jsPsych's naive trial count, which would
            // include the instructions and questionnaires. CSS keeps it hidden
            // until the rooms begin.
            show_progress_bar: true,
            message_progress_bar: "",
            auto_update_progress_bar: false,
            on_finish: function () {
                // download the full trial-by-trial data as CSV
                // jsPsych.data.get().localSave("csv", "exp4_" + subject_id + ".csv");

                // var ppt_data = jsPsych.data.get().json();
                // send_complete(id, ppt_data);
                
                // // redirect to Prolific (links are set in config.js; blank = no redirect).
                // // Passing the comprehension check AND the attention checks -> complete.
                // // DEBUGGING stays put, so a dev run never hits a Prolific completion URL.
                // if (link && !DEBUGGING) {
                    //     setTimeout(function () { window.location.replace(link); }, 2000);
                    // }
                    
                var ppt_data = jsPsych.data.get().json();
                var link = (quiz_passed && !attention_failed) ? REDIRECT_COMPLETE : REDIRECT_FAIL;
                send_complete(id, ppt_data)
                    .then(() => {
                        console.log('Data successfully sent to completion endpoint');
                            window.location.replace(link);
                    })
                    .catch(error => {
                        console.error('Failed to send completion data:', error);
                        document.body.innerHTML += `
                            <div style="max-width: 800px; margin: auto; padding: 20px; font-family: Arial, sans-serif; line-height: 1.6; text-align: left;">
                                <h2>Note: There might have been an issue saving your data, but you will still be redirected shortly.</h2>
                            </div>
                        `;
                        setTimeout(() => {
                            window.location.replace(link);
                        }, 5000);
                    });
            }
        });

        // get prolific id
        var pid = get_prolific_id();
        let id = null;
        create_participant(pid).then((value) => {
        // If the id is null, then the backend is complaining that the ppt has
        // done the experiment before
        // You should probably bail out in that case
        if (value['id'] == null) {
            console.log(`${pid} is not unique`);
        }
        // Otherwise, give the ppt an internal id
        id = value['id'];
        console.log(`id => ${id}`);
        // the id only arrives now, after addProperties below has already stamped
        // subject_id = null; this restamps every row so far and all later ones
        jsPsych.data.addProperties({ subject_id: id });
        })

        // attach session-level fields to every trial's data row
        jsPsych.data.addProperties({
            // subject_id: subject_id,
            subject_id: id,  // use the internal id from the backend rather than the Prolific PID
            study_id: study_id,
            session_id: session_id,
            belief_display: BELIEF_DISPLAY,
            objective: OBJECTIVE,
            confidence_on: CONFIDENCE,
            alpha: ALPHA,
            contextual: CONTEXTUAL,
            alpha_ctx1: ALPHA_CTX1,
            alpha_ctx2: ALPHA_CTX2
            // no session-wide button layout: each trial draws its own, logged per
            // trial (button_orders on the choice row, button_order on the others)
        });

        //------------------------------------//
        // Everything below is built inside loadPresets(): the number of rooms, the
        // per-room button layouts and the per-room preset histories all come from
        // presets.json, so the timeline cannot be assembled until it has arrived.
        //------------------------------------//
        loadPresets().then(function () {

        var timeline = [];

        //------------------------------------//
        // Preload images
        //------------------------------------//
        var preload = {
            type: jsPsychPreload,
            images: ["img/BaseAction_4k.png", "img/Agent.png", "img/Goal.png", "img/Check_orange.png"]
        };
        timeline.push(preload);


        const informedConsentForm = `
            <div style="max-width: 800px; margin: auto; padding: 20px; font-family: Arial, sans-serif; line-height: 1.6; text-align: left;">
                <h2 style="text-align: center; color: rgb(255, 255, 255);">Participation in the Learning and Cognitive Control Study</h2>
                <p>This is a psychology experiment conducted by Dr. Peter Dayan, director of the Max Planck Institute for Biological Cybernetics, and the members of his lab.</p>
                <p>All data collected will be anonymous. We will not ask for any additional personally identifying information and will handle responses as confidentially as possible. However, we cannot guarantee the confidentiality of information transmitted over the Internet. We will keep de-identified data collected as part of this experiment indefinitely, and such data may be used as part of future studies and/or made available to the wider research community for follow-up analyses. Data used in scientific publications will remain completely anonymous.</p>
                <p>Your participation in this research is voluntary. You may refrain from answering any questions that make you uncomfortable and may withdraw your participation at any time without penalty by exiting this task. You may choose not to complete certain parts of the task or answer certain questions.</p>
                <p>Other than monetary compensation, participating in this study will provide no direct benefits to you. However, we hope that this research will benefit society at large by contributing towards establishing a scientific foundation for improving people's learning and cognitive control abilities.</p>
                <p>By selecting the 'consent' button below, you consent to taking part in this study.</p>
                <div style="text-align: center; margin-top: 20px;">
                    <button id="consent-given" style="background-color: #2C3E50; color: white; padding: 10px 20px; border: none; cursor: pointer; margin-right: 10px;">I consent to participate</button>
                </div>
            </div>

        `;

        const informedConsentTrial = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: informedConsentForm,
            response_ends_trial: false,
            on_load: function() { 
                document.body.style.overflowY = "auto";
                document.documentElement.style.overflowY = "auto";
                document.getElementById('consent-given').addEventListener('click', function() {
                    jsPsych.finishTrial();
                });
            }
        };
        timeline.push(informedConsentTrial);


        //------------------------------------//
        // Fullscreen (the enlarged display needs the width)
        //------------------------------------//
        timeline.push({
            type: jsPsychFullscreen,
            fullscreen_mode: true,
            message: `<p>The task runs in fullscreen. Click below to continue.</p>`
        });

        //------------------------------------//
        // Instructions + comprehension gate, then the attention-check explanation
        // + practice. All three are skipped wholesale under DEBUGGING, which drops
        // the participant straight into the first room.
        //------------------------------------//
        if (!DEBUGGING) {
            // Instructions + comprehension gate.
            // Inner: instructions (with their own "review again" loop) -> quiz -> result.
            // Outer loop repeats this whole block while the participant hasn't passed
            // and hasn't used up both attempts. After it ends they've either passed or
            // failed twice.
            var instructions_block = {
                timeline: make_instructions_timeline(),
                loop_function: function () { return review_instructions; }
            };
            timeline.push({
                timeline: [
                    instructions_block, 
                make_comprehension_quiz(), 
                make_quiz_result_trial()],
                loop_function: function () {
                    return !quiz_passed && quiz_attempts < QUIZ_MAX_ATTEMPTS;
                }
            });

            // Attention-check explanation + practice (with feedback), only if the
            // comprehension check was passed. The practice does not count for exclusion.
            timeline.push({
                timeline: make_attention_intro_and_practice(),
                conditional_function: function () { return quiz_passed; }
            });
        }

        //------------------------------------//
        // The experiment itself: only runs if the comprehension check was passed.
        // N_ROOMS choices; each = intro -> the N_AFC rooms' preset histories play
        // out and the participant picks a room (make_room_choice) -> a
        // gold-collection trial in the chosen room.
        //------------------------------------//
        // every node here is skipped once the attention criterion has been failed,
        // so the task halts and falls through to the exclusion screen below.
        var experiment_timeline = [];
        for (let r = 1; r <= N_ROOMS; r++) {
            experiment_timeline.push({
                timeline: [make_choice_intro(r)],
                conditional_function: function () { return !attention_failed; }
            });
            // observation phase for every room, then the choice between them; the
            // chosen room's tally and hidden dynamics carry into the gold phase
            experiment_timeline.push({
                timeline: [make_room_choice(r)],
                conditional_function: function () { return !attention_failed; }
            });
            // rate the chances of getting the coin in the chosen room
            if (CONFIDENCE) {
                experiment_timeline.push({
                    timeline: [make_confidence_trial(r)],
                    conditional_function: function () { return !attention_failed; }
                });
            }
            // the gold selection task only exists under the "gold" objective;
            // under "control" it is straight on to the next trial
            if (OBJECTIVE === "gold") {
                experiment_timeline.push({
                    timeline: [make_gold_pause(r)],
                    conditional_function: function () { return !attention_failed; }
                });
                // the button layout is the chosen room's, read from CHOSEN at run time
                experiment_timeline.push({
                    timeline: [make_gold_trial(r)],
                    conditional_function: function () { return !attention_failed; }
                });
            }
            // attention-check block after every ATTENTION_CHECK_EVERY choices
            // (not after the final one)
            if (ATTENTION_CHECK_EVERY > 0 && r % ATTENTION_CHECK_EVERY === 0 && r < N_ROOMS) {
                experiment_timeline.push({
                    timeline: make_attention_block(),
                    conditional_function: function () { return !attention_failed; }
                });
            }
        }
        // reached the end of the task: congratulate, then run the questionnaires
        experiment_timeline.push({
            timeline: [{
                type: jsPsychHtmlButtonResponse,
                choices: ["Continue"],
                stimulus: screenHTML({
                    title: `Congratulations`,
                    lines: [
                        `You made it to the end of the experiment.`,
                        // no bonus under "control", so don't mention one
                        OBJECTIVE === "gold"
                            ? `Before we calculate your bonus and return you to Prolific, we have a few short questions that we'd like to ask you.`
                            : `Before we return you to Prolific, we have a few short questions that we'd like to ask you.`
                    ]
                }),
                data: { task: "end_congrats" },
                // every room is done: fill the bar before the questionnaires
                on_start: function () { setRoomProgress(1); }
            }],
            conditional_function: function () { return !attention_failed; }
        });
        // end-of-experiment questionnaires (only for participants who completed,
        // i.e. passed comprehension and were not excluded by the attention checks)
        var expfeedback = {
            type: jsPsychSurveyFeedback,
            mental_demand: false,
            task_instructions: true,
            performance: true,
            effort: false,
            frustration: false,
            strategy: true,
            feedback: true,
            data: { task: "expfeedback" }
        };
        experiment_timeline.push({
            timeline: [
                // ius12, loc74_1, loc74_2, 
            expfeedback],
            conditional_function: function () { return !attention_failed; }
        });
        // bonus: fraction of coins collected x GBP 2 (only if not excluded)
        experiment_timeline.push({
            timeline: [{
                type: jsPsychHtmlButtonResponse,
                choices: ["Finish"],
                stimulus: function () {
                    var frac = N_ROOMS > 0 ? collected_gold / N_ROOMS : 0;
                    var bonus = (frac * 2).toFixed(2);
                    return screenHTML({
                        title: `Thank you!`,
                        lines: [
                            // `You collected <strong>${collected_gold}</strong> out of <strong>${N_ROOMS}</strong> gold coins.`,
                            // the bonus line only under "gold"; under "control" there is no bonus
                            ...(OBJECTIVE === "gold" ? [`Your bonus is <strong>&pound;${bonus}</strong>. Well done!`] : []),
                            `Click below to return to Prolific.`,
                            `After clicking DO NOT CLOSE YOUR BROWSER until you have returned to Prolific. This may take a few seconds...`
                        ]
                    });
                },
                data: { task: "bonus" },
                on_start: function () {
                    var frac = N_ROOMS > 0 ? collected_gold / N_ROOMS : 0;
                    // attach to every row so the backend/CSV captures the payout
                    jsPsych.data.addProperties({
                        coins_collected: collected_gold,
                        n_rooms: N_ROOMS,
                        bonus_gbp: (frac * 2).toFixed(2)
                    });
                }
            }],
            conditional_function: function () { return !attention_failed; }
        });
        // exclusion screen (only if the attention criterion was failed)
        // the task has been halted, so a part-filled bar would be misleading
        experiment_timeline.push({
            timeline: [{
                timeline: [make_attention_excluded_trial()],
                on_timeline_start: hideRoomProgress
            }],
            conditional_function: function () { return attention_failed; }
        });
        timeline.push({
            timeline: experiment_timeline,
            conditional_function: function () { return quiz_passed; }
        });

        //------------------------------------//
        // Failed the check twice: end here (the global on_finish handles redirect).
        //------------------------------------//
        timeline.push({
            timeline: [{
                type: jsPsychHtmlButtonResponse,
                choices: ["Finish"],
                stimulus: screenHTML({
                    title: `Thank you for your time`,
                    lines: [
                        `The experiment has ended.`,
                        `Click below to return to Prolific.`
                    ]
                }),
                data: { task: "failed_end" }
            }],
            conditional_function: function () { return !quiz_passed; }
        });

        jsPsych.run(timeline);

        }).catch(function (err) {
            console.error(err);
            document.body.innerHTML = `
                <div style="max-width: 800px; margin: auto; padding: 20px; font-family: Arial, sans-serif; line-height: 1.6; text-align: left;">
                    <h2>Sorry, the task could not be loaded.</h2>
                    <p>Please return the study on Prolific so that someone else can take part.</p>
                </div>`;
        });
    </script>
</html>
